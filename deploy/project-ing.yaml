apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basecamp-project
  annotations:
    acme.cert-manager.io/http01-edit-in-place: 'true'
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
  - host: basecamp-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: my-app-client
              port:
                number: 80
  tls:
  - hosts:
    - basecamp-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev
    secretName: basecamp-ingress-cert
