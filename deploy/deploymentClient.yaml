# Streamlit frontend Deployment.
# - Generic local image; no registry hardcoding.
# - API_URL points at the in-cluster server Service DNS name, so the client
#   never needs pod IPs and nothing is hardcoded per-environment.
# - Probes hit Streamlit's built-in /_stcore/health endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-client
  namespace: fitnessai
  labels:
    app: my-app-client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: my-app-client
  template:
    metadata:
      labels:
        app: my-app-client
    spec:
      containers:
        - name: client
          # Built locally with:  docker build -t fitnessai-client:latest ./client
          # then imported with:  k3d image import fitnessai-client:latest -c fitnessai
          image: fitnessai-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            # In-cluster DNS: <service-name>.<namespace>:<port>
            - name: API_URL
              value: "http://my-app-server.fitnessai:8000"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
