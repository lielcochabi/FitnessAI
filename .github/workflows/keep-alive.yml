name: Keep Alive

# Prevents the free Render backend (sleeps after ~15 min idle) and the
# Streamlit Community Cloud app (sleeps after long inactivity) from going to
# sleep, by pinging both on a schedule.
#
# Setup (one-time, in your GitHub repo):
#   Settings > Secrets and variables > Actions > New repository secret
#     BACKEND_URL    = https://fitnessai-server.onrender.com   (your Render URL)
#     STREAMLIT_URL  = https://your-app.streamlit.app          (your Streamlit URL)
#   Neither URL is hardcoded here, so the workflow is safe to commit.
#
# Notes:
#   - GitHub may delay scheduled runs under load; ~10 min is a practical floor.
#   - GitHub auto-disables scheduled workflows after 60 days with no repo
#     activity. A manual "Run workflow" (workflow_dispatch) re-enables it.
#   - Secrets cannot be used in `if:` conditions, so they are mapped to env
#     vars first and the env vars are checked instead.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
    steps:
      - name: Ping backend /health
        if: env.BACKEND_URL != ''
        run: |
          echo "Pinging backend..."
          curl -fsS --max-time 60 "$BACKEND_URL/health" || \
            echo "Backend ping failed (it may be cold-starting; will retry next run)."

      - name: Ping Streamlit frontend
        if: env.STREAMLIT_URL != ''
        run: |
          echo "Pinging frontend..."
          curl -fsS --max-time 60 "$STREAMLIT_URL" || \
            echo "Frontend ping failed (it may be waking; will retry next run)."
